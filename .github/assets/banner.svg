<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1430"/><stop offset="1" stop-color="#16285a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="500" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="24" fill="url(#dots)"/>

  <!-- top row: name and tagline, install command -->
  <g transform="translate(64 96)">
    <rect x="0" y="-46" width="56" height="56" rx="12" fill="#ffc72c"/>
    <path d="M13 -34 h30 l-11 13 v13 l-8 4 v-17 z" fill="#0a1430"/>
    <text x="76" y="0" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">Qubuilder</text>
  </g>
  <text x="64" y="140" font-size="22" fill="#c3cde6">JSON filters in, Eloquent queries out. Filters, eager loads, sorting and pagination.</text>
  <g transform="translate(812 52)">
    <rect width="404" height="52" rx="26" fill="#1d3170" stroke="#2f4a96"/>
    <text x="22" y="32" font-size="15.5" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#8fa0c8">$ </tspan>composer require kalimulhaq/qubuilder</text>
  </g>

  <!-- 1. the request -->
  <g transform="translate(64 176)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect width="340" height="296" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8fa0c8">The request</text>
    <g fill="#c3cde6">
      <text x="18" y="60">{</text>
      <text x="34.9" y="82"><tspan fill="#ffc72c">"filter"</tspan>: {<tspan fill="#ffc72c">"AND"</tspan>: [</text>
      <text x="51.7" y="104">{<tspan fill="#ffc72c">"field"</tspan>: <tspan fill="#9be3b8">"status"</tspan>,</text>
      <text x="60.1" y="126"><tspan fill="#ffc72c">"op"</tspan>: <tspan fill="#9be3b8">"="</tspan>, <tspan fill="#ffc72c">"value"</tspan>: <tspan fill="#9be3b8">"active"</tspan>},</text>
      <text x="51.7" y="148">{<tspan fill="#ffc72c">"field"</tspan>: <tspan fill="#9be3b8">"age"</tspan>,</text>
      <text x="60.1" y="170"><tspan fill="#ffc72c">"op"</tspan>: <tspan fill="#9be3b8">"&gt;="</tspan>, <tspan fill="#ffc72c">"value"</tspan>: <tspan fill="#9fc3ff">18</tspan>}</text>
      <text x="34.9" y="192">]},</text>
      <text x="34.9" y="214"><tspan fill="#ffc72c">"include"</tspan>: [{<tspan fill="#ffc72c">"name"</tspan>: <tspan fill="#9be3b8">"orders"</tspan>}],</text>
      <text x="34.9" y="236"><tspan fill="#ffc72c">"sort"</tspan>: {<tspan fill="#ffc72c">"created_at"</tspan>: <tspan fill="#9be3b8">"desc"</tspan>},</text>
      <text x="34.9" y="258"><tspan fill="#ffc72c">"limit"</tspan>: <tspan fill="#9fc3ff">20</tspan></text>
      <text x="18" y="280">}</text>
    </g>
  </g>

  <!-- arrow 1 -->
  <g transform="translate(410 324)">
    <circle cx="20" cy="0" r="20" fill="#ffc72c"/>
    <path d="M10 0 h18 m-7 -7 7 7 -7 7" fill="none" stroke="#0a1430" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. the Eloquent query -->
  <g transform="translate(456 176)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect width="320" height="296" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8fa0c8">The Eloquent query</text>
    <g fill="#c3cde6">
      <text x="18" y="82"><tspan fill="#ffffff">User</tspan>::<tspan fill="#ffc72c">query</tspan>()</text>
      <text x="34.9" y="108">-&gt;<tspan fill="#ffc72c">where</tspan>(<tspan fill="#9be3b8">'status'</tspan>, <tspan fill="#9be3b8">'='</tspan>, <tspan fill="#9be3b8">'active'</tspan>)</text>
      <text x="34.9" y="134">-&gt;<tspan fill="#ffc72c">where</tspan>(<tspan fill="#9be3b8">'age'</tspan>, <tspan fill="#9be3b8">'&gt;='</tspan>, <tspan fill="#9fc3ff">18</tspan>)</text>
      <text x="34.9" y="160">-&gt;<tspan fill="#ffc72c">with</tspan>(<tspan fill="#9be3b8">'orders'</tspan>)</text>
      <text x="34.9" y="186">-&gt;<tspan fill="#ffc72c">orderBy</tspan>(<tspan fill="#9be3b8">'created_at'</tspan>, <tspan fill="#9be3b8">'desc'</tspan>)</text>
      <text x="34.9" y="212">-&gt;<tspan fill="#ffc72c">paginate</tspan>(<tspan fill="#9fc3ff">20</tspan>);</text>
    </g>
    <text x="18" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8fa0c8">No if chains, no request parsing.</text>
  </g>

  <!-- arrow 2 -->
  <g transform="translate(782 324)">
    <circle cx="20" cy="0" r="20" fill="#ffc72c"/>
    <path d="M10 0 h18 m-7 -7 7 7 -7 7" fill="none" stroke="#0a1430" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. the SQL it runs -->
  <g transform="translate(828 176)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect width="388" height="296" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8fa0c8">The SQL it runs</text>
    <g fill="#c3cde6">
      <text x="18" y="62"><tspan fill="#ffc72c">SELECT</tspan> count(*) <tspan fill="#ffc72c">AS</tspan> aggregate</text>
      <text x="18" y="83"><tspan fill="#ffc72c">FROM</tspan> `users` <tspan fill="#ffc72c">WHERE</tspan> (…);</text>
      <text x="18" y="113"><tspan fill="#ffc72c">SELECT</tspan> * <tspan fill="#ffc72c">FROM</tspan> `users`</text>
      <text x="18" y="134"><tspan fill="#ffc72c">WHERE</tspan> (`status` = <tspan fill="#9be3b8">'active'</tspan></text>
      <text x="43.3" y="155"><tspan fill="#ffc72c">AND</tspan> `age` &gt;= <tspan fill="#9fc3ff">18</tspan>)</text>
      <text x="18" y="176"><tspan fill="#ffc72c">ORDER BY</tspan> `created_at` <tspan fill="#ffc72c">DESC</tspan></text>
      <text x="18" y="197"><tspan fill="#ffc72c">LIMIT</tspan> <tspan fill="#9fc3ff">20</tspan> <tspan fill="#ffc72c">OFFSET</tspan> <tspan fill="#9fc3ff">0</tspan>;</text>
      <text x="18" y="227"><tspan fill="#ffc72c">SELECT</tspan> * <tspan fill="#ffc72c">FROM</tspan> `orders`</text>
      <text x="18" y="248"><tspan fill="#ffc72c">WHERE</tspan> `orders`.`user_id` <tspan fill="#ffc72c">IN</tspan> (…);</text>
    </g>
    <text x="18" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8fa0c8">Count, the page of users, then their orders.</text>
  </g>
</svg>
